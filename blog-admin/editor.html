<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Editor</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="header-left">
                <a href="blogs.html" class="back-link">← Back to Blogs</a>
                <h1 id="page-title">Add New Blog Post</h1>
            </div>
            <div class="header-right">
                <button onclick="saveBlog('DRAFT')" class="btn-secondary" id="save-draft-btn">Save Draft</button>
                <button onclick="saveBlog('PUBLISHED')" class="btn-primary" id="publish-btn">Publish</button>
            </div>
        </header>
        
        <div class="editor-layout">
            <div class="editor-main">
                <div class="editor-section">
                    <input type="text" id="blog-title" placeholder="Enter blog title here..." class="title-input">
                </div>
                
                <div class="editor-section">
                    <label class="section-label">Excerpt (Optional)</label>
                    <textarea id="blog-excerpt" placeholder="Brief description of the blog post..." rows="3"></textarea>
                </div>
                
                <div class="editor-section">
                    <label class="section-label">Content *</label>
                    <textarea id="blog-content" placeholder="Write your blog content here... (Supports HTML)" rows="20"></textarea>
                    <div class="editor-hint">
                        You can use HTML tags: &lt;p&gt;, &lt;h2&gt;, &lt;h3&gt;, &lt;ul&gt;, &lt;li&gt;, &lt;strong&gt;, &lt;em&gt;
                    </div>
                </div>
            </div>
            
            <div class="editor-sidebar">
                <div class="sidebar-section">
                    <h3>Category *</h3>
                    <select id="blog-category">
                        <option value="">Select Category</option>
                        <option value="Finance">Finance</option>
                        <option value="Technology Support">Technology Support</option>
                        <option value="Offshore Hiring">Offshore Hiring</option>
                    </select>
                </div>
                
                <div class="sidebar-section">
                    <h3>Featured Image</h3>
                    <div id="image-preview" style="display: none;">
                        <img id="preview-img" src="" alt="Featured Image">
                        <button onclick="removeImage()" class="btn-remove">Remove Image</button>
                    </div>
                    <div id="image-upload">
                        <input type="file" id="featured-image" accept="image/*" style="display: none;" onchange="uploadImage()">
                        <button onclick="document.getElementById('featured-image').click()" class="btn-upload">
                            <span id="upload-text">Upload Image</span>
                        </button>
                        <p class="upload-hint">Max size: 5MB</p>
                    </div>
                </div>
                
                <div class="sidebar-section">
                    <h3>Tags</h3>
                    <input type="text" id="blog-tags" placeholder="Add tags, comma separated">
                    <p class="input-hint">Example: Remote Work, Productivity</p>
                </div>
                
                <div class="sidebar-section">
                    <h3>Author</h3>
                    <input type="text" id="blog-author" value="Admin">
                </div>
            </div>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/editor.js"></script>
</body>
</html>
