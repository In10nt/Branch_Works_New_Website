# Production Configuration for AWS Elastic Beanstalk

# Server Configuration
server.port=5000

# Database Configuration (AWS RDS MySQL)
# These will be set as environment variables in AWS Elastic Beanstalk
spring.datasource.url=${RDS_DB_URL}
spring.datasource.username=${RDS_USERNAME}
spring.datasource.password=${RDS_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Disable H2 Console in production
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=/var/app/current/uploads

# CORS Configuration (set your Amplify URL)
cors.allowed.origins=${CORS_ALLOWED_ORIGINS}

# Logging
logging.level.com.branchworks=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.test-connection=false

# Company Email
company.email=${COMPANY_EMAIL:info@branchworksglobal.com}
