# Server Configuration
server.port=${PORT:5000}

# Database Configuration
# Local development: H2 file-based database
# Production (AWS): MySQL RDS (configured via environment variables)
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:${DB_PATH:./data/branchworks_db}}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# JPA Configuration
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# H2 Console (for development only - disabled in production)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=${UPLOAD_DIR:./src/main/resources/static/uploads}

# CORS Configuration
# Local: Allow all origins
# Production: Set via environment variable CORS_ALLOWED_ORIGINS
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.branchworks=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:nuwangimahesha@gmail.com}
spring.mail.password=${MAIL_PASSWORD:mqkgwnkismtltjmy}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtp.connectiontimeout=2000
spring.mail.properties.mail.smtp.timeout=2000
spring.mail.properties.mail.smtp.writetimeout=2000
spring.mail.test-connection=false

# Company Email (where form submissions will be sent)
company.email=${COMPANY_EMAIL:info@branchworksglobal.com}