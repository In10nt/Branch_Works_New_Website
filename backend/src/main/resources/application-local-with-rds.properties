# Local Development with AWS RDS MySQL Database
# Use this profile to connect your local backend to AWS RDS
# This allows you to use the same database locally and in production

# To use this profile, run:
# mvn spring-boot:run -Dspring-boot.run.profiles=local-with-rds

# Server Configuration
server.port=5000

# Database Configuration (AWS RDS MySQL)
# Replace these values with your actual RDS details
spring.datasource.url=jdbc:mysql://[YOUR-RDS-ENDPOINT]:3306/branchworks
spring.datasource.username=admin
spring.datasource.password=[YOUR-RDS-PASSWORD]
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Disable H2 Console
spring.h2.console.enabled=false

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload.dir=./src/main/resources/static/uploads

# CORS Configuration (allow localhost for development)
cors.allowed.origins=http://localhost:3000,http://localhost:3001

# Logging
logging.level.com.branchworks=DEBUG
logging.level.org.springframework=INFO
logging.level.org.hibernate=INFO

# Email Configuration
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=nuwangimahesha@gmail.com
spring.mail.password=mqkgwnkismtltjmy
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com
spring.mail.test-connection=false

