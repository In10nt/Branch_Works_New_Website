version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm install --legacy-peer-deps
    build:
      commands:
        - npm run build
        - echo "Verifying admin folder exists in public..."
        - ls -la public/admin/ || echo "Admin folder not found in public!"
        - echo "Verifying admin folder copied to build..."
        - ls -la build/admin/ || echo "Admin folder not found in build!"
        - echo "Verifying _redirects file..."
        - cat build/_redirects || echo "_redirects not found!"
        - echo "Copying video files to build directory..."
        - mkdir -p build/Video
        - cp public/Video/video.mp4 build/Video/video.mp4 || echo "Video copy failed"
  artifacts:
    baseDirectory: build
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
  customHeaders:
    - pattern: '**/*.webm'
      headers:
        - key: 'Content-Type'
          value: 'video/webm'
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '**/*.mp4'
      headers:
        - key: 'Content-Type'
          value: 'video/mp4'
        - key: 'Cache-Control'
          value: 'public, max-age=31536000'
    - pattern: '/admin/*'
      headers:
        - key: 'Content-Type'
          value: 'text/html; charset=UTF-8'
        - key: 'Cache-Control'
          value: 'no-cache'
