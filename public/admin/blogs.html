<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog Posts - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="header-left">
                <a href="dashboard.html" class="back-link">← Back to Dashboard</a>
                <h1>Blog Posts</h1>
            </div>
            <div class="header-right">
                <a href="editor.html" class="btn-primary">+ Add New Blog</a>
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </header>
        
        <div class="filters">
            <div class="status-filters">
                <button class="filter-btn active" onclick="filterByStatus('all')">All (<span id="count-all">0</span>)</button>
                <button class="filter-btn" onclick="filterByStatus('PUBLISHED')">Published (<span id="count-published">0</span>)</button>
                <button class="filter-btn" onclick="filterByStatus('DRAFT')">Draft (<span id="count-draft">0</span>)</button>
            </div>
            
            <div class="category-filter">
                <select id="category-filter" onchange="filterByCategory()">
                    <option value="all">All Categories</option>
                    <option value="Finance">Finance</option>
                    <option value="Technology Support">Technology Support</option>
                    <option value="Offshore Hiring">Offshore Hiring</option>
                </select>
            </div>
        </div>
        
        <div id="loading" class="loading">Loading blogs...</div>
        <div id="no-blogs" class="no-blogs" style="display: none;">
            <p>No blog posts found.</p>
            <a href="editor.html" class="btn-primary">Create your first blog post</a>
        </div>
        
        <div id="blog-table-container" class="table-container" style="display: none;">
            <table class="blog-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th>Date</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="blog-table-body">
                    <!-- Blogs will be loaded here -->
                </tbody>
            </table>
        </div>
    </div>
    
    <script src="js/config.js"></script>
    <script src="js/blogs.js"></script>
</body>
</html>
