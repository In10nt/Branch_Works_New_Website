<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Career Editor - Admin Panel</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div class="header-left">
                <a href="careers.html" class="back-link">← Back to Careers</a>
                <h1 id="page-title">Add New Career</h1>
            </div>
            <div class="header-right">
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </header>

        <div class="editor-layout">
            <div class="editor-main">
                <!-- Title Section -->
                <div class="editor-section">
                    <label class="section-label">Job Title *</label>
                    <input 
                        type="text" 
                        id="career-title" 
                        class="title-input" 
                        placeholder="e.g., Senior Accountant"
                        required
                    >
                    <p class="input-hint">Enter the job title</p>
                </div>

                <!-- Location Section -->
                <div class="editor-section">
                    <label class="section-label">Location *</label>
                    <input 
                        type="text" 
                        id="career-location" 
                        placeholder="e.g., Colombo"
                        required
                    >
                    <p class="input-hint">City or location</p>
                </div>

                <!-- Work Type Section -->
                <div class="editor-section">
                    <label class="section-label">Work Type *</label>
                    <select id="career-work-type" required>
                        <option value="">Select work type</option>
                        <option value="Hybrid">Hybrid</option>
                        <option value="Remote">Remote</option>
                        <option value="On-site">On-site</option>
                    </select>
                    <p class="input-hint">Select the work arrangement</p>
                </div>

                <!-- LinkedIn URL Section -->
                <div class="editor-section">
                    <label class="section-label">LinkedIn Application URL *</label>
                    <input 
                        type="url" 
                        id="career-linkedin" 
                        placeholder="https://www.linkedin.com/jobs/view/..."
                        required
                    >
                    <p class="input-hint">LinkedIn job posting URL where candidates can apply</p>
                </div>
            </div>

            <div class="editor-sidebar">
                <!-- Department Section -->
                <div class="sidebar-section">
                    <h3>Department *</h3>
                    <select id="career-department" required>
                        <option value="">Select department</option>
                        <option value="Finance">Finance</option>
                        <option value="Technology">Technology</option>
                        <option value="Operations">Operations</option>
                        <option value="Marketing">Marketing</option>
                        <option value="Sales">Sales</option>
                        <option value="Human Resources">Human Resources</option>
                    </select>
                </div>

                <!-- Status Section -->
                <div class="sidebar-section">
                    <h3>Status *</h3>
                    <select id="career-status" required>
                        <option value="ACTIVE">Active</option>
                        <option value="INACTIVE">Inactive</option>
                    </select>
                    <p class="upload-hint">Active roles will be visible on the careers page</p>
                </div>

                <!-- Actions -->
                <div class="sidebar-section">
                    <button id="save-btn" onclick="saveCareer('INACTIVE')" class="btn-secondary" style="width: 100%; margin-bottom: 12px;">
                        Save as Inactive
                    </button>
                    <button id="publish-btn" onclick="saveCareer('ACTIVE')" class="btn-primary" style="width: 100%;">
                        Publish Career
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/career-editor.js"></script>
</body>
</html>
