<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div class="header-left">
                <h1>Admin Panel</h1>
            </div>
            <div class="header-right">
                <button onclick="logout()" class="btn-secondary">Logout</button>
            </div>
        </div>

        <div class="dashboard-grid">
            <!-- Blogs Card -->
            <div class="dashboard-card">
                <div class="dashboard-card-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M19 3H5C3.89543 3 3 3.89543 3 5V19C3 20.1046 3.89543 21 5 21H19C20.1046 21 21 20.1046 21 19V5C21 3.89543 20.1046 3 19 3Z" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 7H17" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 12H17" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M7 17H13" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="dashboard-card-title">Blog Posts</h2>
                <p class="dashboard-card-description">Manage blog posts, create new articles, and update existing content</p>
                <a href="blogs.html" class="dashboard-card-button">Manage Blogs</a>
            </div>

            <!-- Careers Card -->
            <div class="dashboard-card">
                <div class="dashboard-card-icon">
                    <svg width="48" height="48" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M20 7H4C2.89543 7 2 7.89543 2 9V19C2 20.1046 2.89543 21 4 21H20C21.1046 21 22 20.1046 22 19V9C22 7.89543 21.1046 7 20 7Z" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                        <path d="M16 21V5C16 4.46957 15.7893 3.96086 15.4142 3.58579C15.0391 3.21071 14.5304 3 14 3H10C9.46957 3 8.96086 3.21071 8.58579 3.58579C8.21071 3.96086 8 4.46957 8 5V21" stroke="#2563EB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </div>
                <h2 class="dashboard-card-title">Career Openings</h2>
                <p class="dashboard-card-description">Manage job postings, add new roles, and update career opportunities</p>
                <a href="careers.html" class="dashboard-card-button">Manage Careers</a>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
</body>
</html>
